<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Shared Map</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}

#loginBox{padding:10px;}

#mapContainer{
    position:relative;
    display:inline-block;
}

#map{
    width:100%;
    max-width:1200px;
    height:auto;
    user-select:none;
    cursor:crosshair;
}

.marker{
    position:absolute;
    transform:translate(-50%,-50%);
    text-align:center;
    font-size:11px;
    color:white;
    cursor:pointer;
    z-index:10;
}

.dot{
    width:10px;
    height:10px;
    background:red;
    border-radius:50%;
    margin:auto;
    box-shadow:0 0 6px rgba(255,0,0,0.9);
}

.label{
    background:rgba(0,0,0,0.7);
    padding:2px 5px;
    border-radius:4px;
    margin-top:2px;
    white-space:nowrap;
}
</style>
</head>

<body>

<div id="loginBox">
<input id="nickname" placeholder="닉네임 입력">
<button onclick="enter()">입장</button>
</div>

<div id="mapContainer" style="display:none;">
<img src="map.jpg" id="map">
</div>

<script>
const firebaseConfig={
    apiKey:"AIzaSyBZUhksZ6rd_8t9iTFN2Mo-45zNM4E4yuQ",
    authDomain:"rlachdanakxkq.firebaseapp.com",
    databaseURL:"https://rlachdanakxkq-default-rtdb.europe-west1.firebasedatabase.app",
    projectId:"rlachdanakxkq",
    storageBucket:"rlachdanakxkq.firebasestorage.app",
    messagingSenderId:"800304150391",
    appId:"1:800304150391:web:45b4041a549edc3ce3d372"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let myName="";
const map=document.getElementById("map");
const container=document.getElementById("mapContainer");

function enter(){
    const name=document.getElementById("nickname").value.trim();
    if(!name){ alert("닉네임 입력"); return; }

    myName=name;
    document.getElementById("loginBox").style.display="none";
    container.style.display="inline-block";
}

/* 좌표 계산 */
function getCoords(e){
    const rect=map.getBoundingClientRect();
    const scaleX=map.naturalWidth/rect.width;
    const scaleY=map.naturalHeight/rect.height;

    return {
        x:(e.clientX-rect.left)*scaleX,
        y:(e.clientY-rect.top)*scaleY
    };
}

/* 클릭 → 마커 생성 */
map.addEventListener("click",(e)=>{
    if(!myName) return;

    const p=getCoords(e);

    db.ref("markers").push({
        name:myName,
        x:p.x,
        y:p.y,
        time:Date.now()
    });
});

/* 마커 생성 */
db.ref("markers").on("child_added",(snap)=>{
    const d=snap.val();
    const fbKey=snap.key;

    const rect=map.getBoundingClientRect();
    const scaleX=rect.width/map.naturalWidth;
    const scaleY=rect.height/map.naturalHeight;

    const marker=document.createElement("div");
    marker.className="marker";
    marker.dataset.fbkey=fbKey;

    marker.style.left=(d.x*scaleX)+"px";
    marker.style.top=(d.y*scaleY)+"px";

    const dot=document.createElement("div");
    dot.className="dot";

    const label=document.createElement("div");
    label.className="label";
    label.innerText=d.name;

    marker.appendChild(dot);
    marker.appendChild(label);

    /* ⭐ 마커 클릭하면 삭제 (누구든 가능) */
    marker.onclick=(ev)=>{
        ev.stopPropagation();
        db.ref("markers/"+fbKey).remove();
    };

    container.appendChild(marker);
});

/* 마커 삭제 */
db.ref("markers").on("child_removed",(snap)=>{
    const fbKey=snap.key;

    document.querySelectorAll(".marker").forEach(m=>{
        if(m.dataset.fbkey===fbKey){
            m.remove();
        }
    });
});
</script>

</body>
</html>
