<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Shared Tactical Map</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body{
 margin:0;
 background:#111;
 color:white;
 text-align:center;
 font-family:Arial;
}

#topbar{
 padding:8px;
 background:#000;
}

#mapContainer{
 position:relative;
 display:inline-block;
}

#map{
 width:200%;
 max-width:none;
 cursor:crosshair;
}

.marker{
 position:absolute;
 transform:translate(-50%,-50%);
 cursor:pointer;
 z-index:10;
}

/* 아군 */
.dot{
 width:10px;
 height:10px;
 background:red;
 border-radius:50%;
}

/* 적 */
.enemyDot{
 width:10px;
 height:10px;
 background:#0077ff;
 border-radius:50%;
 box-shadow:0 0 6px #00aaff;
}

.label{
 background:rgba(0,0,0,.7);
 padding:2px 5px;
 border-radius:4px;
 font-size:11px;
 white-space:nowrap;
}

/* 접속자 */
#users{
 position:fixed;
 right:10px;
 top:10px;
 background:rgba(0,0,0,.7);
 padding:8px;
 border-radius:6px;
 font-size:12px;
 text-align:left;
}

/* ⭐⭐ 범례 추가 */
#legend{
 position:fixed;
 left:10px;
 top:10px;
 background:rgba(0,0,0,.75);
 padding:8px 10px;
 border-radius:6px;
 font-size:13px;
 text-align:left;
}

.legendRow{
 display:flex;
 align-items:center;
 margin:4px 0;
}

.legendDot{
 width:10px;
 height:10px;
 border-radius:50%;
 margin-right:6px;
}

.red{ background:red; }
.blue{ background:#0077ff; box-shadow:0 0 6px #00aaff; }
</style>
</head>

<body>

<div id="topbar">
<input id="nickname" placeholder="닉네임">
<button onclick="enter()">입장</button>

<button onclick="setMode('normal')">일반</button>
<button onclick="setMode('enemy')">적 위치</button>
</div>

<!-- ⭐ 범례 표시 -->
<div id="legend">
<b>마커 설명</b>
<div class="legendRow">
 <div class="legendDot red"></div> 아군
</div>
<div class="legendRow">
 <div class="legendDot blue"></div> 적
</div>
</div>

<div id="users">
접속자:<br>
<div id="userList"></div>
</div>

<div id="mapContainer" style="display:none;">
 <img src="map.jpg" id="map">
</div>

<script>
const firebaseConfig={
 apiKey:"AIzaSyBZUhksZ6rd_8t9iTFN2Mo-45zNM4E4yuQ",
 authDomain:"rlachdanakxkq.firebaseapp.com",
 databaseURL:"https://rlachdanakxkq-default-rtdb.europe-west1.firebasedatabase.app",
 projectId:"rlachdanakxkq"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let myName="";
let mode="normal";
let loaded=false;

const map=document.getElementById("map");
const container=document.getElementById("mapContainer");

function setMode(m){ mode=m; }

function enter(){
 myName=document.getElementById("nickname").value.trim();
 if(!myName){ alert("닉네임 입력"); return; }

 container.style.display="inline-block";

 db.ref("online/"+myName).set(true);
 db.ref("online/"+myName).onDisconnect().remove();

 setTimeout(()=>{
   if(!loaded){
     loadMarkers();
     watchUsers();
     loaded=true;
   }
 },100);
}

function getRatio(e){
 const rect=map.getBoundingClientRect();
 return {
  rx:(e.clientX-rect.left)/rect.width,
  ry:(e.clientY-rect.top)/rect.height
 };
}

map.addEventListener("click",(e)=>{
 if(!myName) return;

 const p=getRatio(e);

 db.ref("markers").push({
  name:myName,
  rx:p.rx,
  ry:p.ry,
  type:mode
 });
});

function loadMarkers(){

 db.ref("markers").on("child_added",(snap)=>{
   const d=snap.val();
   const key=snap.key;

   const rect=map.getBoundingClientRect();

   const m=document.createElement("div");
   m.className="marker";
   m.dataset.key=key;

   m.style.left=(d.rx*rect.width)+"px";
   m.style.top=(d.ry*rect.height)+"px";

   const dot=document.createElement("div");
   dot.className=(d.type==="enemy") ? "enemyDot" : "dot";

   const label=document.createElement("div");
   label.className="label";
   label.innerText=d.name;

   m.appendChild(dot);
   m.appendChild(label);

   m.onclick=(ev)=>{
     ev.stopPropagation();
     db.ref("markers/"+key).remove();
   };

   container.appendChild(m);
 });

 db.ref("markers").on("child_removed",(snap)=>{
   const key=snap.key;
   document.querySelectorAll(".marker").forEach(m=>{
     if(m.dataset.key===key) m.remove();
   });
 });
}

function watchUsers(){
 db.ref("online").on("value",(snap)=>{
   const data=snap.val()||{};
   const list=document.getElementById("userList");
   list.innerHTML="";

   Object.keys(data).forEach(name=>{
     const d=document.createElement("div");
     d.innerText="• "+name;
     list.appendChild(d);
   });
 });
}
</script>

</body>
</html>
