<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Shared Map</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body{
 margin:0;
 background:#111;
 color:white;
 text-align:center;
 font-family:Arial;
}
#mapContainer{
 position:relative;
 display:inline-block;
}
#map{
 width:100%;
 max-width:1200px;
 cursor:crosshair;
}
.marker{
 position:absolute;
 transform:translate(-50%,-50%);
 cursor:pointer;
 z-index:10;
}
.dot{
 width:10px;height:10px;
 background:red;
 border-radius:50%;
}
.label{
 background:rgba(0,0,0,.7);
 padding:2px 5px;
 border-radius:4px;
 font-size:11px;
 white-space:nowrap;
}
</style>
</head>

<body>

<input id="nickname" placeholder="닉네임">
<button onclick="enter()">입장</button>

<div id="mapContainer" style="display:none;">
 <img src="map.jpg" id="map">
</div>

<script>
const firebaseConfig={
 apiKey:"AIzaSyBZUhksZ6rd_8t9iTFN2Mo-45zNM4E4yuQ",
 authDomain:"rlachdanakxkq.firebaseapp.com",
 databaseURL:"https://rlachdanakxkq-default-rtdb.europe-west1.firebasedatabase.app",
 projectId:"rlachdanakxkq"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let myName="";
let loaded=false;

const map=document.getElementById("map");
const container=document.getElementById("mapContainer");

/* 입장 */
function enter(){
 myName=document.getElementById("nickname").value.trim();
 if(!myName){ alert("닉네임 입력"); return; }

 container.style.display="inline-block";

 // ⭐ 지도 실제 보인 뒤 마커 로드
 setTimeout(()=>{
   if(!loaded){
     loadMarkers();
     loaded=true;
   }
 },100);
}

/* 좌표 비율 저장 */
function getRatio(e){
 const rect=map.getBoundingClientRect();
 return {
  rx:(e.clientX-rect.left)/rect.width,
  ry:(e.clientY-rect.top)/rect.height
 };
}

/* 클릭 → 생성 */
map.addEventListener("click",(e)=>{
 if(!myName) return;

 const p=getRatio(e);

 db.ref("markers").push({
  name:myName,
  rx:p.rx,
  ry:p.ry
 });
});

/* ⭐ 마커 로딩 함수 */
function loadMarkers(){

 db.ref("markers").on("child_added",(snap)=>{
   const d=snap.val();
   const key=snap.key;

   const rect=map.getBoundingClientRect();

   const m=document.createElement("div");
   m.className="marker";
   m.dataset.key=key;

   m.style.left=(d.rx*rect.width)+"px";
   m.style.top=(d.ry*rect.height)+"px";

   const dot=document.createElement("div");
   dot.className="dot";

   const label=document.createElement("div");
   label.className="label";
   label.innerText=d.name;

   m.appendChild(dot);
   m.appendChild(label);

   m.onclick=(ev)=>{
     ev.stopPropagation();
     db.ref("markers/"+key).remove();
   };

   container.appendChild(m);
 });

 db.ref("markers").on("child_removed",(snap)=>{
   const key=snap.key;
   document.querySelectorAll(".marker").forEach(m=>{
     if(m.dataset.key===key) m.remove();
   });
 });
}

/* 화면 리사이즈 → 위치 재계산 */
window.addEventListener("resize",()=>{
 document.querySelectorAll(".marker").forEach(m=>m.remove());
 loaded=false;
 if(container.style.display!=="none"){
   loadMarkers();
   loaded=true;
 }
});
</script>

</body>
</html>
